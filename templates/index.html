<!DOCTYPE html>
<html>
<head>
    <title>Liver Cancer AI System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>Liver Cancer AI System</h1>

<div class="card">

<form id="form">
    <h3>Enter Patient Details</h3>

    <input id="age" placeholder="Age" required>
    <input id="tb" placeholder="Total Bilirubin" required>
    <input id="db" placeholder="Direct Bilirubin" required>
    <input id="alk" placeholder="ALP" required>
    <input id="alt" placeholder="ALT" required>
    <input id="ast" placeholder="AST" required>
    <input id="tp" placeholder="Total Proteins" required>
    <input id="alb" placeholder="Albumin" required>
    <input id="ratio" placeholder="A/G Ratio" required>

    <button type="submit">Predict</button>
</form>

</div>

<div id="result"></div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
